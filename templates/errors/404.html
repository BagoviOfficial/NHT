{% extends 'base.html' %}

{% block title %}404 — Not Found — {{ COMPANY_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
  <div class="col-md-6">
    <div class="card card-nht p-5 shadow-sm">
      <div class="d-inline-flex p-3 rounded-circle bg-secondary bg-opacity-10 text-secondary mx-auto mb-3">
        <i class="bi bi-compass fs-1"></i>
      </div>
      <h2 class="fw-bold text-dark">404 — Page Not Found</h2>
      <p class="text-secondary mb-4">
        The requested record, shipment, or resource does not exist or has been moved.
      </p>
      <div>
        <a href="{% url 'home' %}" class="btn btn-primary fw-semibold px-4">Return Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
